<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Order to your table</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--bg); }
  .shell { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  .top {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(8px); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); position: relative; }
  .brand-mark::after { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 2px; margin: -1px 0 0 0; background: var(--bg); border-radius: 1px; }
  main { flex: 1; padding: 24px 16px 140px; }
  .top-actions { display: flex; align-items: center; gap: 4px; }
  .langs { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 999px; }
  .langs .btn { height: 28px; min-width: 32px; padding: 0 8px; border-radius: 999px; font: 500 12px var(--mono); color: var(--muted); }
  .langs .btn[lang="ar"] { font: 500 14px var(--sans); }
  .langs .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .hello { display: grid; gap: 4px; margin-bottom: 24px; }
  .hello h1 { font-size: 32px; }

  .category { margin-top: 28px; }
  .category:first-of-type { margin-top: 0; }
  .category h2 { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item-name { font-size: 15px; font-weight: 500; }
  .item-price { font: 13px var(--mono); color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; height: 36px; }
  .stepper button { width: 36px; height: 34px; border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1; border-radius: 999px; color: var(--ink); }
  .stepper button:disabled { color: var(--faint); cursor: default; }
  .stepper output { min-width: 22px; text-align: center; font: 500 14px var(--mono); }
  .add { height: 36px; border-radius: 999px; padding: 0 16px; }
  .note { margin-top: 28px; }
  .voice { display: grid; gap: 8px; margin: 0 0 28px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
  .voice label { font-size: 13px; font-weight: 500; }
  .voice-row { display: flex; gap: 8px; }
  .voice-row .input { min-width: 0; flex: 1; height: 40px; }
  .voice-row .btn { height: 40px; }
  .mic { width: 40px; padding: 0; border-radius: 50%; flex: none; }
  .mic.listening { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .mic.listening { animation: listen 1.4s ease-out infinite; }
  }
  @keyframes listen { 0% { box-shadow: 0 0 0 0 var(--accent-soft); } 100% { box-shadow: 0 0 0 10px transparent; } }
  .lang { width: 40px; padding: 0; font: 500 12px var(--mono); flex: none; }
  .voice-result { font-size: 13px; min-height: 0; }
  .voice-result:empty { display: none; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
  }
  .bar-inner { max-width: 488px; margin: 0 auto; display: grid; gap: 8px; }
  .bar .btn { width: 100%; justify-content: space-between; }
  .bar-hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* tracking */
  .track-head { display: grid; gap: 8px; margin-bottom: 20px; }
  .track-head h1 { font-size: 30px; }
  .eta { display: flex; gap: 24px; margin: 4px 0 20px; }
  .eta div { display: grid; }
  .eta strong { font: 500 24px/1.2 var(--mono); letter-spacing: -0.02em; }
  .eta span { font-size: 12px; color: var(--muted); }
  .mini-map { height: 300px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; margin-bottom: 20px; }
  .receipt { display: grid; gap: 8px; font-size: 14px; }
  .receipt-row { display: flex; justify-content: space-between; gap: 12px; }
  .receipt-row span + span { font-family: var(--mono); }
  .actions { display: grid; gap: 8px; margin-top: 20px; }
  .actions .btn { width: 100%; }
  .countdown { font-family: var(--mono); }
  .tables { display: grid; gap: 8px; }
  .tables a { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; font-weight: 500; }
  .tables a:hover { background: var(--bg-hover); }
  @media (prefers-reduced-motion: no-preference) {
    .arrived h1 { animation: arrive .5s cubic-bezier(.2, .8, .2, 1); }
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Tunibot</div>
    <div class="top-actions">
      <div class="langs" id="lang" role="group" aria-label="Language"></div>
      <button class="btn btn-ghost icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5v11a5.5 5.5 0 0 1 0-11Z"/></svg>
      </button>
    </div>
  </header>
  <div class="banner" id="offline" hidden>The robot server isn't reachable. Your order is safe; this page reconnects by itself.</div>
  <main id="app" aria-live="polite"><p class="muted">…</p></main>
</div>
<script src="/common.js"></script>
<script src="/i18n.js"></script>
<script src="/table.js"></script>
</body>
</html>
