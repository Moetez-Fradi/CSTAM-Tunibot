# All coordinates are in the saved first-floor map frame.
# These are deliberately semantic names: task requests never contain x/y.
supported_floors: [1]

dock:
  floor: 1
  x: -3.63
  # Shift 0.23 m south within the same docking/staging area. With the full
  # padded footprint, the old pose enclosed one lethal static-map cell.
  y: 0.85
  yaw: -0.522

kitchen:
  floor: 1
  x: 0.02
  y: 9.27
  yaw: 1.049

table_1:
  floor: 1
  x: -6.36
  y: 1.32
  yaw: -0.522

table_2:
  floor: 1
  # West service approach to the same table. The previous pose was inside
  # its real tabletop collision despite being a free occupancy-map cell.
  x: -5.60
  y: 1.96
  yaw: 0.0

table_3:
  floor: 1
  x: -3.55
  y: 1.02
  yaw: 2.619

# Terrace, through the opened west doors (0.92 m clear leaf each).
# Delivery poses face the table from the facade side: ~0.25 m to the
# furniture ahead, ~0.7 m to the wall behind.
terrace_1:
  floor: 1
  x: -8.05
  y: 6.55
  yaw: 3.1416

terrace_2:
  floor: 1
  x: -8.00
  y: 2.50
  yaw: 3.1416

# Terrace doors (not delivery targets). A trip between the dining room and
# the terrace is routed square through a door: inside staging pose ->
# outside staging pose (or the reverse), then the target. The door nearest
# the terrace location is tried first; if its legs keep failing (e.g. a
# person standing in it), the other door is used.
doors:
  terrace_x: -7.05      # x < terrace_x is the terrace zone
  inside_x: -6.40
  outside_x: -7.75
  door_a:
    y: 3.74
  door_b:
    y: 7.20
