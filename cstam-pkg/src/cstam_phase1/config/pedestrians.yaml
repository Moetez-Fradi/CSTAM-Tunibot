# Restaurant pedestrian scenario for dynamic-obstacle testing.
# Waypoints are in the saved map frame: [x, y] or [x, y, dwell_seconds].
# behavior: polite (slows down, steps aside, stops for the robot)
#           oblivious (walks at full speed; only stops when physically blocked)
# Each person targets one encounter on the robot's real delivery routes.

params:
  notice_distance: 2.5
  sidestep: 0.45

pedestrians:
  # Head-on in the 1.6 m west aisle the robot uses for kitchen <-> tables.
  - name: waiter_ali
    behavior: polite
    speed: 0.9
    color: [0.95, 0.95, 0.95]
    route: [[-2.5, 8.9, 2.0], [-4.5, 7.2], [-6.0, 5.6], [-6.0, 3.0, 4.0]]

  # Fast perpendicular crossing of both the west diagonal and the east route.
  - name: guest_sara
    behavior: oblivious
    speed: 1.0
    start_delay: 5.0
    color: [0.80, 0.15, 0.20]
    route: [[-5.2, 7.6, 4.0], [3.0, 7.6, 4.0]]

  # Walks back and forth across the mouth of the robot's home corridor
  # (doorway x 5.02..6.58 at y 10.4), where every trip starts and ends.
  - name: chef_omar
    behavior: polite
    speed: 0.6
    color: [0.98, 0.65, 0.10]
    route: [[3.4, 9.4, 3.0], [8.0, 9.4, 3.0]]

  # Slow walker in front of the dock and the table 1-3 approaches.
  - name: guest_lina
    behavior: oblivious
    speed: 0.5
    start_delay: 10.0
    color: [0.55, 0.25, 0.75]
    route: [[-1.8, -0.4, 6.0], [-5.4, -0.4, 6.0]]

  # Stands for 30 s in the middle of the east route, then moves on: the
  # planner must route around a person who is not moving.
  - name: guest_youssef
    behavior: polite
    speed: 0.7
    color: [0.15, 0.55, 0.35]
    route: [[0.3, 5.5, 30.0], [0.3, 1.8, 30.0]]
