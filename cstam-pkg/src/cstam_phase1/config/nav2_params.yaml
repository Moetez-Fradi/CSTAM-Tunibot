amcl:
  ros__parameters:
    use_sim_time: true
    # Measured calibrated pure-turn error is ~2%, rather than the 32%
    # angular standard deviation implied by alpha1=0.10. Retain allowance
    # for skid-steer variation without admitting large chair-pattern aliases.
    alpha1: 0.005
    alpha2: 0.10
    alpha3: 0.10
    alpha4: 0.10
    alpha5: 0.10
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_navigation
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 12.0
    max_beams: 60
    min_particles: 500
    max_particles: 3000
    pf_err: 0.02
    pf_z: 0.99
    sigma_hit: 0.20
    z_hit: 0.70
    z_rand: 0.30
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    transform_tolerance: 0.50
    tf_broadcast: true
    # The phase1 launch publishes the Gazebo/map-aligned pose.  Letting AMCL
    # also initialize itself would briefly publish (0, 0, 0) and can cause
    # the publisher to stop before the real pose is accepted.
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # ms to wait for an action server to acknowledge a goal. 20 ms was too
    # tight once the global costmap also carries the people layer: a first
    # compute_path_to_pose after startup went unacknowledged and aborted.
    default_server_timeout: 200

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.30
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Count actual angular progress during deliberate in-place alignment.
      # A 0.25 rad/s service turn crosses 0.50 rad in about 2 seconds;
      # small oscillations still expire after the unchanged 15-second limit.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.50
      required_movement_radius: 0.20
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.20
    FollowPath:
      # Matched kitchen -> table1: DWB 192.8s/6 recoveries; shim+DWB
      # 138.5s/3; RPP 165.8s/4. All used the centred drive TF and
      # unchanged real map, footprint and costmaps, with zero contacts.
      # NavFn may start 2.60 rad away from the robot's current heading.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.50
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.40
      simulate_ahead_time: 1.50
      rotate_to_goal_heading: true
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.15
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_x: -0.30
      decel_lim_y: 0.0
      decel_lim_theta: -0.40
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      # BaseObstacle grades inflated center costs; ObstacleFootprint checks
      # the actual rectangle, including corners during a dining-area turn.
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.03
      BaseObstacle.scale: 0.03
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.35, 0.27], [0.35, -0.27], [-0.31, -0.27], [-0.31, 0.27]]"
      footprint_padding: 0.01
      plugins: [voxel_layer, people_layer, inflation_layer]
      people_layer:
        # Tracked people now and along their predicted path (2 s), from
        # dynamic_obstacle_tracker; never raw scans. Its cloud carries a ring beyond obstacle_max_range whose rays clear
        # this whole layer every update, so people who moved on leave no
        # stale obstacles behind.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: people
        people:
          topic: /dynamic_obstacles/costmap_local
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 6.0
          raytrace_min_range: 0.0
          raytrace_max_range: 7.0
          observation_persistence: 0.0
          # 0 = no staleness abort. A tracker hiccup must not abort navigation:
          # the voxel layer still sees every raw obstacle, and the collision
          # monitor stops the robot if the people stream goes stale.
          expected_update_rate: 0.0
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        # Sixteen rings span 80 degrees: ~0.187 m vertical separation at
        # the 2 m local-window edge. A 0.20 m grid avoids retaining thin
        # quantization slivers between otherwise observed free rays.
        z_resolution: 0.20
        z_voxels: 7
        max_obstacle_height: 1.27
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: points clearing_points
        points:
          # The 3D cloud minus tracked people (dynamic_obstacle_tracker):
          # people are handled by people_layer and must not leave voxel trails.
          topic: /lidar/points_static
          data_type: PointCloud2
          marking: true
          # Rays to every hit also clear the voxels they pass through. With
          # only no-return rays clearing, a person who walked by left a
          # lethal voxel trail (the enclosed restaurant returns almost every
          # ray), which stalled the controller among phantom walls. Rays end
          # at the hit, and floor returns are already filtered out.
          clearing: true
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 10.0
          min_obstacle_height: 0.04
          max_obstacle_height: 1.27
        clearing_points:
          topic: /lidar/points_clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          raytrace_min_range: 0.10
          raytrace_max_range: 10.0
          # Free-space rays may terminate on the rendered floor below z=0
          # or on distant surfaces. The voxel raytracer clips them to its
          # volume; these endpoints are never used for obstacle marking.
          min_obstacle_height: -15.0
          max_obstacle_height: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The padded footprint's circumscribed radius is about 0.456 m.
        # Keep at least 0.05 m of route clearance around that full radius.
        inflation_radius: 0.51
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.35, 0.27], [0.35, -0.27], [-0.31, -0.27], [-0.31, 0.27]]"
      # The SLAM map already contains the fixed first-floor obstacles.  Keep
      # raw LiDAR marking in the rolling local costmap only; otherwise old
      # scans can leave stale global obstacles behind the moving robot and
      # make NavFn re-planning nondeterministic. Tracked people are the one
      # live input, so the planner routes around someone standing in an aisle.
      footprint_padding: 0.01
      plugins: [static_layer, people_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      people_layer:
        # Only tracked people from dynamic_obstacle_tracker, never raw scans.
        # Its cloud carries a ring beyond obstacle_max_range whose rays clear
        # this whole layer every update, so people who moved on leave no
        # stale obstacles behind.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: people
        people:
          topic: /dynamic_obstacles/costmap_global
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 6.0
          raytrace_min_range: 0.0
          raytrace_max_range: 7.0
          observation_persistence: 0.0
          # 0 = no staleness abort. A tracker hiccup must not abort navigation:
          # the voxel layer still sees every raw obstacle, and the collision
          # monitor stops the robot if the people stream goes stale.
          expected_update_rate: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The padded footprint's circumscribed radius is about 0.456 m.
        # Keep a measured 0.05 m map-cell margin around that physical radius.
        inflation_radius: 0.51
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.50
      # Both A* and Dijkstra passed direct planning from the clean dock.
      # Preserve the measured Dijkstra baseline; execution failures are
      # investigated separately from global path generation.
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 500
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.50
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.3]
    min_velocity: [-0.10, 0.0, -0.3]
    max_accel: [0.25, 0.0, 0.40]
    max_decel: [-0.30, 0.0, -0.40]
    odom_topic: /odom
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Person-only safety layer. Its source is the tracker's current people,
    # not the raw scan: the accepted routes pass within centimetres of tables
    # by design, and a raw-scan zone would stall them. Static geometry is
    # already handled by the costmaps and the footprint critic.
    # Only stop / limit / approach actions: each is a cap independent of the
    # incoming command. A ratio "slowdown" compounds with the controllers'
    # acceleration ramp (next = measured + accel*dt), measured to pin the
    # robot at ~1.7 cm/s and 0.027 rad/s until the progress checker failed.
    polygons: [PersonStop, PersonLimit, PersonApproach]
    PersonStop:
      # Direction-aware: only the zone the robot is about to sweep stops it.
      type: velocity_polygon
      action_type: stop
      min_points: 4
      visualize: true
      enabled: true
      polygon_pub_topic: person_stop_zone
      holonomic: false
      # First match wins. A turning robot also swings its rear corners
      # sideways, so only near-straight driving uses the narrow front box.
      velocity_polygons: [rotation, forward, forward_turning, reverse, stopped]
      rotation:
        # Swept circle of an in-place turn (circumscribed radius 0.456 m)
        # plus ~0.15 m for tracking latency (8 Hz, people up to 1 m/s).
        points: "[[0.554, 0.230], [0.230, 0.554], [-0.230, 0.554], [-0.554, 0.230], [-0.554, -0.230], [-0.230, -0.554], [0.230, -0.554], [0.554, -0.230]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -1.0
        theta_max: 1.0
      forward:
        points: "[[0.65, 0.33], [0.65, -0.33], [-0.10, -0.33], [-0.10, 0.33]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -0.10
        theta_max: 0.10
      forward_turning:
        # Front zone plus the swept corner circle with latency margin (0.6 m).
        points: "[[0.65, 0.40], [0.42, 0.55], [0.23, 0.60], [-0.23, 0.60], [-0.55, 0.23], [-0.55, -0.23], [-0.23, -0.60], [0.23, -0.60], [0.42, -0.55], [0.65, -0.40]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
      reverse:
        # Backing away is checked only behind the robot: a person in front
        # must not prevent the robot from making room (BackUp recovery).
        points: "[[0.10, 0.40], [0.10, -0.40], [-0.70, -0.40], [-0.70, 0.40]]"
        linear_min: -1.0
        linear_max: -0.02
        theta_min: -1.0
        theta_max: 1.0
      stopped:
        points: "[[0.45, 0.33], [0.45, -0.33], [-0.45, -0.33], [-0.45, 0.33]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
    PersonLimit:
      # Creep past people ahead; turning in place is not limited.
      type: polygon
      action_type: limit
      points: "[[1.40, 0.60], [1.40, -0.60], [-0.10, -0.60], [-0.10, 0.60]]"
      linear_limit: 0.07
      angular_limit: 0.30
      min_points: 4
      visualize: true
      enabled: true
      polygon_pub_topic: person_slowdown_zone
    PersonApproach:
      # Scales speed so the footprint never reaches a person within 1.5 s.
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: [people]
    people:
      type: pointcloud
      topic: /dynamic_obstacles/people
      min_height: 0.1
      max_height: 1.5
      enabled: true
